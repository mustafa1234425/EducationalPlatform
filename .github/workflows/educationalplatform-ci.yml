name: CI-CD for EducationalPlatform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout code
      uses: actions/checkout@v3

   
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    
    - name: Restore dependencies
      run: dotnet restore

    
    - name: Build solution
      run: dotnet build --configuration Release --no-restore

   
    - name: Run unit tests
      run: dotnet test --no-restore --verbosity normal

   
    - name: Publish artifact
      run: dotnet publish EducationalPlatform.API/EducationalPlatform.API.csproj -c Release -o ./publish

    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: educationalplatform-api
        path: ./publish

  mock-deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    
    - name: Download build artifact
      uses: actions/download-artifact@v3
      with:
        name: educationalplatform-api
        path: ./publish

  
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    
    - name: Run API (Mock Deploy)
      run: |
        cd publish
        nohup dotnet EducationalPlatform.API.dll &
        sleep 30
        echo "Mock deploy test completed successfully."
